<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c6b43">
  <title>ゴルフ オリンピック計算</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-label="ゴルフ オリンピック計算アプリ">
    <section id="setupPanel" class="panel setup-panel">
      <p class="eyebrow">Golf Olympic Score</p>
      <h1>オリンピック計算</h1>
      <p class="lead">人数と名前を登録して、18ホールのポイントを片手で入力できます。</p>

      <form id="setupForm" class="setup-form">
        <label class="field-label" for="playerCount">プレー人数</label>
        <div class="count-row">
          <input id="playerCount" type="number" inputmode="numeric" min="1" max="12" step="1" placeholder="例：4" aria-describedby="countHelp">
          <button id="makeNameFields" type="button" class="button secondary">名前欄を作成</button>
        </div>
        <p id="countHelp" class="hint">1〜12人まで。人数変更後に名前欄を作成してください。</p>

        <div id="nameFields" class="name-fields" aria-live="polite"></div>

        <button type="submit" class="button primary full">ラウンド開始</button>
      </form>
    </section>

    <section id="scorePanel" class="score-panel hidden" aria-label="スコア入力">
      <header class="top-status panel">
        <div>
          <p class="eyebrow">現在のホール</p>
          <h1><span id="currentHoleLabel">1</span>H</h1>
        </div>
        <div class="status-grid">
          <div class="status-card">
            <span class="status-title">入力済み</span>
            <strong id="completedHoles">0/18</strong>
          </div>
          <div class="status-card top-card">
            <span class="status-title">総合トップ</span>
            <strong id="topPlayer">-</strong>
            <small id="topScore">0 pt</small>
          </div>
        </div>
      </header>

      <section class="hole-nav panel" aria-label="ホール切り替え">
        <button id="prevHole" type="button" class="button nav-button">前のホール</button>
        <label class="hole-select-label" for="holeSelect">
          <span>ホール</span>
          <select id="holeSelect" aria-label="ホール番号を選択"></select>
        </label>
        <button id="nextHole" type="button" class="button nav-button">次のホール</button>
      </section>

      <section class="panel input-panel">
        <div class="section-title-row">
          <h2>メンバー別ポイント</h2>
          <span id="saveState" class="save-state">保存済み</span>
        </div>
        <div id="scoreInputs" class="score-inputs"></div>
      </section>

      <section class="panel ranking-panel" aria-label="途中経過ランキング">
        <div class="section-title-row">
          <h2>簡易ランキング</h2>
          <button id="toggleDetails" type="button" class="text-button" aria-expanded="false" aria-controls="detailArea">詳細表示</button>
        </div>
        <ol id="rankingList" class="ranking-list"></ol>
      </section>

      <section id="detailArea" class="panel detail-panel hidden" aria-label="ホール別ポイント詳細">
        <div class="section-title-row compact-title">
          <div>
            <h2>ホール別一覧・支払額</h2>
            <span class="detail-note">支払額 = 個人pt × 人数 - 全員pt</span>
          </div>
          <button id="closeDetails" type="button" class="text-button close-detail-button">閉じる</button>
        </div>
        <div id="detailBody" class="detail-cards"></div>
      </section>

      <section class="action-bar" aria-label="操作ボタン">
        <button id="newRound" type="button" class="button secondary">新規ラウンド開始</button>
        <button id="resetData" type="button" class="button danger">データリセット</button>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
